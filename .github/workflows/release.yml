name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run smoke
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/check-release.cjs "$GITHUB_REF_NAME"
      - name: Build package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Run packaged application smoke
        run: node scripts/smoke-package.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Generate checksums
        run: node scripts/checksums.cjs ${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/alpha*.yml
            release/beta*.yml
            release/latest*.yml
            release/SHA256-*.txt
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/merge-artifacts.cjs
      - run: node scripts/checksums.cjs all
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "Cortexia Island $GITHUB_REF_NAME" --prerelease --notes-file docs/RELEASE_NOTES.md
